// app/build.gradle
plugins {
    id 'com.android.application'
    // (if you ever add Kotlin) id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.example.openglandroid"      // pick your package
    compileSdk 34

    defaultConfig {
        applicationId "com.example.openglandroid"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            cmake {
                // any flags you want
                cppFlags ""
            }
        }
        ndk {
            abiFilters "arm64-v8a"            // and/or other ABIs you support
        }
    }

    buildTypes {
        debug { }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    externalNativeBuild {
        cmake {
            path "../CMakeLists.txt"
        }
    }

    // (optional) Java 8+ support
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    compileOnly files("$System.env.ANDROID_HOME/platforms/android-34/android.jar")
}